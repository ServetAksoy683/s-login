# =========================================
#  S-Login Config
# =========================================
# language: turkish, russia veya english
language: turkish

# Giris yapmak icin tanilan sure (saniye). Sure dolunca oyuncu sunucudan atilir.
login-timeout-seconds: 120

# Art arda kac yanlis sifre denemesinden sonra oyuncu aninda atilsin.
max-failed-attempts: 4

# Sifrenin olmasi gereken minimum uzunluk.
min-password-length: 4

# Giris yapmadan once oyuncunun ekranini karartir (End'in icindeymis gibi hicbir sey goremez).
blind-effect: true

# Giris yapmadan once oyuncunun hareket etmesini engeller (oldugu yerde kalir).
freeze-movement: true

# Giris yapmadan once oyuncunun hasar almasini engeller (dusup olmesin diye).
prevent-damage: true

# Giris yapmadan once sohbet etmesini ve diger komutlari kullanmasini engeller.
block-chat-and-commands: true

# =========================================
#  Ses efektleri. sound degerini bos birakirsan (sound: "") o olay icin ses calinmaz.
# =========================================
sounds:
  register-success:
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.2
  login-success:
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.5
  wrong-password:
    sound: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 0.8
  kicked:
    sound: "ENTITY_ENDERMAN_TELEPORT"
    volume: 1.0
    pitch: 0.6
  tick:
    sound: "BLOCK_NOTE_BLOCK_HAT"
    volume: 0.7
    pitch: 1.8
  tick-urgent:
    sound: "BLOCK_NOTE_BLOCK_HAT"
    volume: 1.0
    pitch: 2.0
  confirm-needed:
    sound: "BLOCK_NOTE_BLOCK_BELL"
    volume: 1.0
    pitch: 1.0
  confirmed:
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.3
  error:
    sound: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 0.8
  admin-action:
    sound: "ENTITY_ENDER_DRAGON_GROWL"
    volume: 0.5
    pitch: 1.4

